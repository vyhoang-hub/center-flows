<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatch Workflow</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <h1 id="centerName">Dispatch Center</h1>
      <span class="sub" id="centerSub"></span>
      <div class="tags" id="centerTags"></div>
    </header>

    <!-- Body: canvas + layer panel -->
    <div class="app-body">
      <div class="canvas-wrap" id="canvasWrap">
        <div class="stage" id="stage"></div>

        <!-- Zoom / pan / fullscreen controls (float over the canvas) -->
        <div class="canvas-controls" id="canvasControls">
          <button class="ctrl-btn" id="zoomIn"  aria-label="Zoom in"  title="Zoom in">+</button>
          <button class="ctrl-btn" id="zoomOut" aria-label="Zoom out" title="Zoom out">&minus;</button>
          <button class="ctrl-btn" id="zoomFit" aria-label="Fit to screen" title="Fit to screen">Fit</button>
          <button class="ctrl-btn" id="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
        </div>

        <!-- Reopen tab, shown only when the layer panel is collapsed -->
        <button class="layers-reopen" id="layersReopen" aria-label="Show layers panel" title="Show layers">
          ☰ Layers
        </button>
      </div>

      <!-- Layer panel -->
      <aside class="layer-panel" id="layerPanel">
        <div class="layer-panel-head">
          <h2>Layers</h2>
          <button class="panel-collapse" id="panelCollapse" aria-label="Hide layers panel" title="Hide panel">&times;</button>
        </div>
        <div id="layerList"></div>
        <div class="panel-actions">
          <button class="link-btn" id="showAll">Show all</button>
          <button class="link-btn" id="hideAll">Hide all</button>
        </div>
        <div class="staff-card" id="staffCard"></div>
      </aside>

      <!-- Detail panel (slides in from the right when a node is clicked) -->
      <aside class="detail" id="detail" data-cat="neutral">
        <div class="detail-head" id="detailHead"></div>
        <div class="detail-body" id="detailBody"></div>
      </aside>
    </div>
  </div>

  <!-- Load order matters: data first, then renderers, then the app wiring.
       Plain <script> tags (no modules) so it works from a double-clicked file. -->
  <!-- To show a different dispatch center, point this line at another data file. -->
  <script src="data/norcomm.js"></script>
  <script src="js/diagram.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
