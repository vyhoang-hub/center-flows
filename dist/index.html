<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatch Workflow</title>
  <!-- Bundled build: all CSS/JS/data/SVGs inlined. Generated by build.sh. -->
  <style>
/* =============================================================================
 * THEME — colors & tokens (taken directly from the Figma design)
 * =============================================================================
 * The Figma palette is intentionally muted. Role circles are all one slate;
 * category color coding lives in labels, pills, and the detail-panel accent.
 * ========================================================================== */

:root {
  /* --- Exact Figma fills --------------------------------------------------- */
  --slate:      #354a57;   /* all role circles */
  --octagon:    #c9d9e4;   /* field-resource octagons (legacy) */
  --sage:       #6e936e;   /* CAD / system boxes (Figma #6E936E) */
  --pink:       #b866a3;   /* communication pills & comm paths */
  --red:        #c95548;   /* 911 outline pill (Figma #c95548) */
  --yellow:     #c3ad61;   /* non-emergency outline pill (Figma #c3ad61) */
  --tan:        #c7c0b8;   /* dashed zone outlines */
  --tan-label:  #9c9287;   /* zone label text (Figma #9c9287) */
  --flow:       #454141;   /* incident-flow lines (Figma #454141) */
  --ink-note:   #454141;   /* incident annotation text (Figma #454141) */
  --paper:      #f9f9f8;   /* diagram surface / label chips (Figma #F9F9F8) */

  /* --- Category accents (detail panel + layer dots), per concept doc ------- */
  --police:     #2f6fdb;   --police-soft: #e7f0fd;
  --fire:       #e2542c;   --fire-soft:   #fdece6;
  --system:     #4f8a4f;   --system-soft: #eaf3ea;
  --data:       #1f9d68;   --data-soft:   #e4f6ee;
  --neutral:    #354a57;   --neutral-soft:#eef1f5;

  /* --- Surfaces / type ----------------------------------------------------- */
  --bg:         #f3f4f6;
  --canvas-bg:  #fefefd;
  --panel-bg:   #ffffff;
  --border:     #e5e7eb;
  --ink:        #111827;
  --ink-soft:   #6b7280;
  --grid:       #eceef1;

  --radius:     10px;
  --shadow:     0 1px 3px rgba(16,24,40,.08), 0 4px 12px rgba(16,24,40,.06);
  --shadow-lift:0 6px 20px rgba(16,24,40,.16);
  --font: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* Map category name -> accent vars for the detail panel & layer dots. */
[data-cat="police"]  { --c: var(--police);  --c-soft: var(--police-soft);  }
[data-cat="fire"]    { --c: var(--fire);    --c-soft: var(--fire-soft);    }
[data-cat="system"]  { --c: var(--system);  --c-soft: var(--system-soft);  }
[data-cat="data"]    { --c: var(--data);    --c-soft: var(--data-soft);    }
[data-cat="neutral"] { --c: var(--neutral); --c-soft: var(--neutral-soft); }

/* Layer-dot colors */
[data-color="slate"]   { --c: var(--slate);   }
[data-color="blue"]    { --c: var(--octagon); }
[data-color="sage"]    { --c: var(--sage);    }
[data-color="pink"]    { --c: var(--pink);    }
[data-color="flow"]    { --c: var(--flow);    }
[data-color="neutral"] { --c: var(--ink-soft);}
/* =============================================================================
 * APP LAYOUT & COMPONENTS
 * ========================================================================== */

* { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%;
  font-family: var(--font);
  color: var(--ink); background: var(--bg);
  overflow: hidden;                 /* no page scrollbars; the canvas pans instead */
}

/* --panel-w = width of the right-hand layers card.
   The canvas is now full-bleed; the header, panels, toolbar and detail card all
   FLOAT over it as rounded cards for a more modern look. */
.app { position: relative; height: 100vh; --panel-w: 232px; }

/* Floating header card — no longer a full-width bar touching the edges. */
.app-header {
  position: absolute; top: 16px; left: 16px; right: 16px; z-index: 8;
  display: flex; align-items: center; gap: 16px;
  padding: 12px 18px; background: var(--panel-bg);
  border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow);
}
.app-header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
.app-header .sub { color: var(--ink-soft); font-size: 13px; }
.app-header .tags { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.app-header .tag {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; line-height: 1;
  border-radius: 20px; padding: 6px 12px;
  border: 1px solid transparent;
}
.app-header .tag .tag-ic { display: inline-flex; line-height: 0; }
.app-header .tag .tag-ic .lucide { width: 15px; height: 15px; }
/* Color-code system: each tag tone gets its own tint + accent text/border. */
.app-header .tag[data-tone="location"] { background: var(--police-soft); color: var(--police); border-color: color-mix(in srgb, var(--police) 25%, transparent); }
.app-header .tag[data-tone="agency"]   { background: var(--data-soft);   color: var(--data);   border-color: color-mix(in srgb, var(--data) 25%, transparent); }
.app-header .tag[data-tone="size"]     { background: var(--fire-soft);   color: var(--fire);   border-color: color-mix(in srgb, var(--fire) 25%, transparent); }
.app-header .tag[data-tone="neutral"]  { background: var(--neutral-soft); color: var(--ink-soft); }

/* Body fills the whole app; the canvas is full-bleed and everything floats. */
.app-body {
  position: absolute; inset: 0; overflow: hidden;
}

/* ---- Canvas -------------------------------------------------------------- */
.canvas-wrap {
  position: absolute; inset: 0; overflow: hidden;   /* full-bleed, pan/zoom */
  touch-action: none;                      /* we handle wheel/drag ourselves */
  cursor: grab;
  background: var(--canvas-bg);            /* plain surface — no grid */
}
.canvas-wrap.grabbing { cursor: grabbing; }
/* The stage is authored in Figma pixels; JS pans/zooms it via transform.
   No `will-change: transform` — that pinned the stage to a GPU layer rasterized
   at 100% and then bitmap-scaled to fit, which made shapes/text look blurry.
   Without it the browser re-rasterizes crisply at the current zoom. */
.stage { position: relative; transform-origin: 0 0; }

/* ---- Zoom / pan / fullscreen toolbar ------------------------------------- */
.canvas-controls {
  position: absolute; right: 14px; bottom: 14px; z-index: 6;
  display: flex; flex-direction: column; gap: 6px;
}
.ctrl-btn {
  display: flex; align-items: center; gap: 8px;
  min-width: 118px; height: 36px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-bg); color: var(--ink);
  font-family: var(--font); font-size: 13px; font-weight: 500;
  line-height: 1; cursor: pointer; box-shadow: var(--shadow); text-align: left;
}
.ctrl-btn:hover { background: var(--neutral-soft); border-color: var(--slate); }
.ctrl-btn:active { transform: translateY(1px); }
.ctrl-btn:focus-visible { outline: 3px solid #7aa7ff; outline-offset: 2px; }
.ctrl-ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; font-size: 17px; flex: none;
}
.ctrl-lbl { white-space: nowrap; }

/* Prominent tab to reopen the layers panel; only visible when collapsed.
   Sits just below the floating header. */
.layers-reopen {
  position: absolute; top: 84px; right: 16px; z-index: 7; display: none;
  border: 1px solid var(--slate); background: var(--slate); color: #fff;
  border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 600;
  cursor: pointer; box-shadow: var(--shadow); font-family: var(--font);
}
.layers-reopen:hover { filter: brightness(1.1); }
body.panel-collapsed .layers-reopen { display: block; }

/* Connectors: exact Figma SVGs, positioned absolutely. Behind the nodes. */
.connector { position: absolute; pointer-events: none; }
.connector img { display: block; width: 100%; height: 100%; }

/* Regions: large soft background groupings (e.g. the "inside the center" blob).
   Behind everything; the blob SVG fills its box. */
.region { position: absolute; pointer-events: none; z-index: 0; }
.region img { display: block; width: 100%; height: 100%; }
.region-label {
  position: absolute; z-index: 0; pointer-events: none;
  font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
  color: #c5c5c5; text-transform: uppercase; white-space: nowrap;
}

/* Annotations: free italic narrative notes (the flow story). Centered like
   Figma (the note's x is its center), 11px, #454141. */
.annotation-note {
  position: absolute; z-index: 2; pointer-events: none;
  font-size: 11px; font-style: italic; font-weight: 500; line-height: 1.3;
  color: var(--ink-note); text-align: center; transform: translateX(-50%);
}

/* Zones: data-drawn grouping outlines (no SVG export needed). */
.zone {
  position: absolute; pointer-events: none;
  border: 1.5px dashed var(--c, var(--tan));
  border-radius: 18px;
}
.zone-label {
  position: absolute; top: -11px; left: 24px;
  background: var(--paper); color: var(--ink-soft);
  font-size: 12px; font-weight: 600; letter-spacing: .5px;
  padding: 0 8px; white-space: nowrap;
}

/* Edges: data-drawn curved lines between nodes. One SVG over the whole stage. */
.edge-layer { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
.edge.faded { opacity: .08; }
.zone.faded { opacity: .08; }

/* ---- Nodes --------------------------------------------------------------- */
.node {
  position: absolute; padding: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  cursor: pointer; border: none; background: transparent;
  transition: transform .12s ease, filter .12s ease, opacity .2s ease;
  z-index: 2;
}
.node:hover { transform: scale(1.05); filter: drop-shadow(var(--shadow-lift)); z-index: 3; }
.node:focus-visible { outline: 3px solid #7aa7ff; outline-offset: 3px; }
/* Selected shape: a colored ring (in the node's category color) + lift so it's
   clear which node is open. Octagons use drop-shadow so the ring follows the
   clip-path silhouette; circles/boxes use box-shadow for a clean even ring. */
.node.selected { transform: scale(1.06); z-index: 4; }
.node.circle.selected  { box-shadow: 0 0 0 4px var(--panel-bg), 0 0 0 7px var(--c); }
.node.system.selected  { box-shadow: 0 0 0 3px var(--panel-bg), 0 0 0 6px var(--c); }
/* Resource nodes have a soft glow already; on select, ring the glow blob. */
.node.resource.selected .node-glow {
  filter: drop-shadow(0 0 3px var(--c)) drop-shadow(0 0 2px var(--c));
}
.node .lbl { line-height: 1.15; font-weight: 700; }
.node .ic  { display: inline-flex; line-height: 0; margin-bottom: 2px; }
.node .ic .lucide { width: 32px; height: 32px; }
.node .ic-img { width: 34px; height: 34px; display: block; }
.lucide { display: inline-block; vertical-align: middle; }

/* circle roles — solid slate, white text (Figma) */
.node.circle {
  border-radius: 50%; background: var(--slate); color: #fff;
}
.node.circle .lbl { font-size: 12px; padding: 6px; }

/* Resource nodes — soft blurred glow blob (Figma SVG) with the Phosphor icon
   centered and a bold dark label BELOW the blob (matches the design). The
   button box is the blob's size; the label overflows beneath it. */
.node.resource {
  background: transparent; color: var(--ink); overflow: visible;
}
.node.resource .node-glow {
  position: absolute; left: 50%; top: 50%;
  width: 127%; height: 127%; transform: translate(-50%, -50%);
  pointer-events: none; z-index: 0;
}
.node.resource .ic { position: relative; z-index: 1; }
.node.resource .lbl {
  position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
  margin-top: 2px; font-size: 13px; font-weight: 700;
  color: var(--ink); white-space: nowrap; text-align: center;
}

/* system (CAD) boxes — sage, rounded, white bold text */
.node.system {
  background: var(--sage); color: #fff; border-radius: 4px;
}
.node.system .lbl { font-size: 11px; padding: 8px; font-weight: 700; }

/* faded = a layer this node belongs to is off */
.faded { opacity: .08 !important; pointer-events: none; }

/* ---- Pills / labels ------------------------------------------------------ */
.pill {
  position: absolute; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; white-space: nowrap; pointer-events: none;
}
.pill.has-icon { gap: 4px; padding: 4px 8px; }
.pill .pill-ic { display: inline-flex; line-height: 0; }
.pill .pill-ic .lucide { width: 13px; height: 13px; }
.pill .pill-ic-img { width: 16px; height: 16px; display: block; }
.pill.comm         { background: var(--pink); color: #fff; font-weight: 700; }
/* Intake tags: white fill, colored border + text (outline style, per Figma). */
.pill.c911         { background: #fff; color: var(--red);    font-weight: 700; border: 1px solid var(--red);    border-radius: 22px; padding: 3px 12px; }
.pill.nonemergency { background: #fff; color: var(--yellow); font-weight: 700; border: 1px solid var(--yellow); border-radius: 17px; padding: 3px 12px; }
.pill.zonelabel    { background: var(--paper);  color: var(--tan-label); font-weight: 700; font-size: 13.5px; }
.pill.flowlabel    { background: var(--paper);  color: var(--ink-note); font-style: italic; font-size: 11px; }
/* Count annotations center on their x (like Figma) so they sit under the node
   regardless of text width. min-width from `w` no longer shifts them sideways. */
.pill.annotation   { color: var(--tan-label); font-style: italic; background: transparent; transform: translateX(-50%); min-width: 0 !important; }

/* ---- Layer panel (floating card, top-right under the header) ------------- */
.layer-panel {
  position: absolute; top: 84px; right: 16px; z-index: 7;
  width: var(--panel-w); max-height: calc(100vh - 100px);
  background: var(--panel-bg); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow);
  padding: 16px 16px 12px; display: flex; flex-direction: column; overflow-y: auto;
}
.layer-panel-head {
  display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px;
}
.layer-panel h2 {
  font-size: 11px; letter-spacing: 1.5px; color: var(--ink-soft);
  text-transform: uppercase; margin: 0;
}
.panel-collapse {
  border: 1px solid var(--border); background: var(--panel-bg); cursor: pointer;
  color: var(--ink); font-family: var(--font); font-size: 12px; font-weight: 600;
  line-height: 1; padding: 6px 10px; border-radius: 7px;
}
.panel-collapse:hover { background: var(--neutral-soft); border-color: var(--slate); }

/* Collapsed: hide the floating panel; the reopen tab brings it back. */
body.panel-collapsed .layer-panel { display: none; }
.layer-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 0; cursor: pointer; user-select: none;
}
.layer-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.layer-name { font-size: 13.5px; flex: 1; }
.switch {
  width: 32px; height: 18px; border-radius: 20px; background: #cdd4dd;
  position: relative; transition: background .15s ease; flex: none;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s ease;
}
.layer-row[aria-pressed="true"] .switch { background: var(--slate); }
.layer-row[aria-pressed="true"] .switch::after { left: 16px; }

.panel-actions { margin-top: auto; padding-top: 16px; display: flex; gap: 16px; }
.link-btn {
  background: none; border: none; padding: 0; cursor: pointer;
  color: var(--ink-soft); font-size: 12px; text-decoration: underline;
}
.link-btn:hover { color: var(--ink); }

/* Floats over the bottom-left of the canvas with generous padding around it. */
.staff-card {
  position: absolute; left: 18px; bottom: 18px; z-index: 6;
  max-width: 240px; padding: 14px 16px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel-bg); box-shadow: var(--shadow);
}
.staff-card:empty { display: none; }
.staff-card h3 { margin: 0 0 6px; font-size: 12px; }
.staff-card p { margin: 0 0 6px; font-size: 12.5px; }
.staff-card ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-soft); }

/* ---- Detail card (floating) ---------------------------------------------- */
/* A floating rounded card, not a docked sidebar. It sits to the LEFT of the
   layers panel so the legend stays visible, and fades in (fade-in-fwd) rather
   than sliding. Hidden by default; JS adds .open to show it. */
@keyframes fade-in-fwd {
  0%   { transform: translateZ(-80px); opacity: 0; }
  100% { transform: translateZ(0);     opacity: 1; }
}
.detail {
  position: absolute; top: 84px; right: calc(var(--panel-w) + 32px);
  width: 360px; max-width: calc(100vw - var(--panel-w) - 64px);
  max-height: calc(100vh - 100px);
  background: var(--panel-bg); border: 1px solid var(--border);
  border-radius: 14px; box-shadow: var(--shadow-lift);
  z-index: 20; display: none; flex-direction: column; overflow: hidden;
}
.detail.open { display: flex; animation: fade-in-fwd .28s cubic-bezier(.39,.575,.565,1) both; }
/* When the layers panel is collapsed, dock the card near the right edge. */
body.panel-collapsed .detail { right: 16px; max-width: calc(100vw - 32px); }
.detail-head { padding: 18px 20px; border-bottom: 1px solid var(--border); border-top: 4px solid var(--c); border-radius: 14px 14px 0 0; }
.detail-head .kicker { font-size: 12px; color: var(--c); font-weight: 700; }
.detail-head h2 { margin: 4px 0 2px; font-size: 19px; }
.detail-close {
  position: absolute; top: 14px; right: 14px; border: none; background: none;
  font-size: 22px; cursor: pointer; color: var(--ink-soft); line-height: 1;
}
.detail-body { padding: 18px 20px; overflow-y: auto; }
.detail-body h3 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
  color: var(--ink-soft); margin: 18px 0 8px;
}
.detail-body h3:first-child { margin-top: 0; }
.detail-body ul { margin: 0; padding-left: 20px; }
.detail-body li { margin-bottom: 6px; font-size: 14px; line-height: 1.45; }
.chip {
  display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 6px;
  background: var(--c-soft); color: var(--c); margin: 0 6px 6px 0;
}

/* ---- Fullscreen ---------------------------------------------------------- */
/* When .app is the fullscreen element it fills the screen; the existing grid
   (header + body) already lays out correctly. Just guarantee the background. */
.app:fullscreen { background: var(--bg); }
.app:-webkit-full-screen { background: var(--bg); }

/* ---- Responsive ---------------------------------------------------------- */
@media (max-width: 820px) {
  /* Narrow: the floating cards shrink and the detail card takes near-full width
     so it stays readable; everything still floats over the full-bleed canvas. */
  .layer-panel { width: 200px; max-height: calc(100vh - 160px); }
  .detail, body.panel-collapsed .detail {
    right: 12px; left: 12px; width: auto; max-width: none;
  }
  .app-header { flex-wrap: wrap; }
}
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <h1 id="centerName">Dispatch Center</h1>
      <span class="sub" id="centerSub"></span>
      <div class="tags" id="centerTags"></div>
    </header>

    <!-- Body: canvas + layer panel -->
    <div class="app-body">
      <div class="canvas-wrap" id="canvasWrap">
        <div class="stage" id="stage"></div>

        <!-- Zoom / pan / fullscreen toolbar (floats over the canvas) -->
        <div class="canvas-controls" id="canvasControls">
          <button class="ctrl-btn" id="zoomIn"  title="Zoom in">
            <span class="ctrl-ic">+</span><span class="ctrl-lbl">Zoom in</span>
          </button>
          <button class="ctrl-btn" id="zoomOut" title="Zoom out">
            <span class="ctrl-ic">&minus;</span><span class="ctrl-lbl">Zoom out</span>
          </button>
          <button class="ctrl-btn" id="zoomFit" title="Fit the whole diagram">
            <span class="ctrl-ic">⤢</span><span class="ctrl-lbl">Fit</span>
          </button>
          <button class="ctrl-btn" id="fullscreen" title="Fullscreen">
            <span class="ctrl-ic">⛶</span><span class="ctrl-lbl">Fullscreen</span>
          </button>
        </div>

        <!-- Reopen tab, shown only when the layer panel is collapsed -->
        <button class="layers-reopen" id="layersReopen" title="Show the layers panel">
          ☰ Show Layers
        </button>

        <!-- Staff distribution — floats over the bottom-left of the canvas -->
        <div class="staff-card" id="staffCard"></div>
      </div>

      <!-- Layer panel -->
      <aside class="layer-panel" id="layerPanel">
        <div class="layer-panel-head">
          <h2>Layers</h2>
          <button class="panel-collapse" id="panelCollapse" title="Hide the layers panel">
            Hide &rsaquo;
          </button>
        </div>
        <div id="layerList"></div>
        <div class="panel-actions">
          <button class="link-btn" id="showAll">Show all</button>
          <button class="link-btn" id="hideAll">Hide all</button>
        </div>
      </aside>

      <!-- Detail panel (slides in from the right when a node is clicked) -->
      <aside class="detail" id="detail" data-cat="neutral">
        <div class="detail-head" id="detailHead"></div>
        <div class="detail-body" id="detailBody"></div>
      </aside>
    </div>
  </div>

  <!-- Load order matters: data first, then renderers, then the app wiring.
       Plain <script> tags (no modules) so it works from a double-clicked file. -->
  <!-- To show a different dispatch center, point this line at another data file. -->

 * ========================================================================== */

var STAGE_W = 2210;
var STAGE_H = 1303;

  flame:      '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',

/* Return an inline <svg> string for a Lucide icon name, or "" if unknown.
   Falls back gracefully so an emoji or stray name won't break rendering. */
function iconSvg(name, size) {
  if (!name || !LUCIDE[name]) return "";
  size = size || 24;

    'stroke-linejoin="round" aria-hidden="true">' + LUCIDE[name] + "</svg>";

var Diagram = {
  data: null,
  onNodeClick: null,
  _selectedEl: null,   // the currently selected node element (for the highlight)

  /* Mark a node element as selected (adds the outline ring). Pass null to clear.
     Clicking a node calls this; closing the detail card clears it. */
  select: function (el) {
    if (this._selectedEl) this._selectedEl.classList.remove("selected");
    this._selectedEl = el || null;
    if (this._selectedEl) this._selectedEl.classList.add("selected");
  },

  // Pan/zoom state. scale = zoom factor; tx/ty = pan offset in screen px.
  scale: 1,
  tx: 0,
  ty: 0,
  minScale: 0.1,
  maxScale: 4,

  render: function (data, onNodeClick) {
    this.data = data;
    this.onNodeClick = onNodeClick;

    var stage = document.getElementById("stage");
    stage.style.width = STAGE_W + "px";
    stage.style.height = STAGE_H + "px";
    stage.innerHTML = "";

    // Draw order = stacking order. Regions (e.g. the "inside the center" blob)
    // sit at the very back, then zones, then the two ways of drawing lines
    // (exported Figma SVGs and data-driven edges), then nodes and pills on top.
    this._renderRegions(stage, data.regions || []);
    this._renderZones(stage, data.zones || []);
    this._renderConnectors(stage, data.connectors || []);
    this._renderEdges(stage, data.edges || [], data.nodes || []);
    this._renderNodes(stage, data.nodes || []);
    this._renderPills(stage, data.pills || []);
    this._renderAnnotations(stage, data.annotations || []);

    this._initInteractions();
    this.fit();
    window.addEventListener("resize", function () { Diagram.fit(); });

    // In an embedded iframe (e.g. SharePoint) the canvas often has 0 size at
    // first render, so the initial fit() can't compute a real scale. Re-fit
    // once the element actually gets a size, and again after full load, so the
    // diagram doesn't end up scaled/positioned off-screen.
    var wrap = document.getElementById("canvasWrap");
    if (wrap && typeof ResizeObserver !== "undefined") {
      var ro = new ResizeObserver(function () {
        if (wrap.clientWidth > 0 && wrap.clientHeight > 0) Diagram.fit();
      });
      ro.observe(wrap);
    }
    window.addEventListener("load", function () { Diagram.fit(); });
  },

  /* Write the current scale + pan to the stage as a single transform. */
  _apply: function () {
    var stage = document.getElementById("stage");
    stage.style.transformOrigin = "0 0";
    stage.style.transform =
      "translate(" + this.tx + "px," + this.ty + "px) scale(" + this.scale + ")";
  },

  /* Fit the whole diagram inside the canvas and center it. This is the default
     view and the "Fit" button. */
  fit: function () {
    var wrap = document.getElementById("canvasWrap");
    if (!wrap) return;
    var cw = wrap.clientWidth, ch = wrap.clientHeight;
    // Canvas not sized yet (common in a freshly-loaded iframe). Bail without
    // touching the transform — the ResizeObserver will call fit() again once
    // the element has real dimensions, avoiding an off-screen placement.
    var pad = 24;
    if (cw <= pad * 2 || ch <= pad * 2) return;
    var s = Math.min((cw - pad * 2) / STAGE_W, (ch - pad * 2) / STAGE_H);
    if (!isFinite(s) || s <= 0) return;
    this.scale = Math.max(this.minScale, Math.min(this.maxScale, s));
    // Center the scaled stage in the viewport.
    this.tx = (cw - STAGE_W * this.scale) / 2;
    this.ty = (ch - STAGE_H * this.scale) / 2;
    this._apply();
  },

  /* Zoom by a factor, keeping the point (cx,cy) — in canvas screen px —
     fixed under the cursor. Used by the wheel and the +/- buttons. */
  zoomAt: function (factor, cx, cy) {
    var wrap = document.getElementById("canvasWrap");
    if (cx == null) { cx = wrap.clientWidth / 2; cy = wrap.clientHeight / 2; }
    var newScale = Math.max(this.minScale, Math.min(this.maxScale, this.scale * factor));
    if (newScale === this.scale) return;
    // Keep the world point under the cursor stationary.
    this.tx = cx - (cx - this.tx) * (newScale / this.scale);
    this.ty = cy - (cy - this.ty) * (newScale / this.scale);
    this.scale = newScale;
    this._apply();
  },

  /* Wire up wheel-zoom and drag-to-pan on the canvas. */
  _initInteractions: function () {
    var wrap = document.getElementById("canvasWrap");
    if (!wrap || wrap._interactive) return;   // guard against double-binding
    wrap._interactive = true;

    // Wheel = zoom toward the cursor.
    wrap.addEventListener("wheel", function (e) {
      e.preventDefault();
      var rect = wrap.getBoundingClientRect();
      var cx = e.clientX - rect.left, cy = e.clientY - rect.top;
      var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      Diagram.zoomAt(factor, cx, cy);
    }, { passive: false });

    // Drag empty canvas = pan. Dragging starts panning only when the press
    // didn't land on a node/button (so clicking a node still opens its panel).
    var panning = false, sx = 0, sy = 0, startTx = 0, startTy = 0, moved = false;
    wrap.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".node, .ctrl-btn, .layers-reopen")) return;
      panning = true; moved = false;
      sx = e.clientX; sy = e.clientY; startTx = Diagram.tx; startTy = Diagram.ty;
      wrap.classList.add("grabbing");
      wrap.setPointerCapture(e.pointerId);
    });
    wrap.addEventListener("pointermove", function (e) {
      if (!panning) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      Diagram.tx = startTx + dx; Diagram.ty = startTy + dy;
      Diagram._apply();
    });
    function endPan(e) {
      if (!panning) return;
      panning = false;
      wrap.classList.remove("grabbing");
      try { wrap.releasePointerCapture(e.pointerId); } catch (_) {}
    }
    wrap.addEventListener("pointerup", endPan);
    wrap.addEventListener("pointercancel", endPan);
  },

  /* Regions — large soft background shapes that group the whole workflow
     (e.g. the "inside the center" blob). Each is an absolutely-positioned SVG
     drawn behind everything, with an optional label chip.
       x/y/w/h : top-left + size in stage units
       asset   : an SVG in /assets (or inlined via ASSET_MAP), drawn to fill
       fill    : background color if no asset is given
       label / labelX / labelY : optional caption placed at absolute stage coords */
  _renderRegions: function (stage, regions) {
    regions.forEach(function (r) {
      var el = document.createElement("div");
      el.className = "region";
      el.dataset.layers = (r.layers || []).join(",");
      el.style.left = r.x + "px";
      el.style.top = r.y + "px";
      el.style.width = r.w + "px";
      el.style.height = r.h + "px";
      if (r.asset) {
        var img = document.createElement("img");
        img.src = assetSrc(r.asset);
        img.alt = "";
        el.appendChild(img);
      } else if (r.fill) {
        el.style.background = r.fill;
      }
      stage.appendChild(el);

      if (r.label) {
        var tag = document.createElement("span");
        tag.className = "region-label";
        tag.textContent = r.label;
        tag.style.left = (r.labelX != null ? r.labelX : r.x + 24) + "px";
        tag.style.top = (r.labelY != null ? r.labelY : r.y + 20) + "px";
        tag.dataset.layers = (r.layers || []).join(",");
        stage.appendChild(tag);
      }
    });
  },

  /* Annotations — free italic narrative notes placed at absolute stage coords
     (the flow story: "call -> incident...", etc.). Pure data, no SVG. */
  _renderAnnotations: function (stage, annotations) {
    annotations.forEach(function (a) {
      var el = document.createElement("div");
      el.className = "annotation-note";
      el.dataset.layers = (a.layers || ["annotations"]).join(",");
      el.style.left = a.x + "px";
      el.style.top = a.y + "px";
      if (a.w) el.style.width = a.w + "px";
      el.textContent = a.text;
      stage.appendChild(el);
    });
  },

  /* Zones — big grouping outlines (e.g. CALL / POLICE / FIRE) drawn from data,
     no SVG export needed. A dashed rounded rectangle with a small label chip.
     x/y is the TOP-LEFT of the zone in stage units. */
  _renderZones: function (stage, zones) {
    zones.forEach(function (z) {
      var el = document.createElement("div");
      el.className = "zone";
      el.dataset.layers = (z.layers || []).join(",");
      el.dataset.color = z.color || "neutral";
      el.style.left = z.x + "px";
      el.style.top = z.y + "px";
      el.style.width = z.w + "px";
      el.style.height = z.h + "px";
      if (z.label) {
        var tag = document.createElement("span");
        tag.className = "zone-label";
        tag.textContent = z.subtitle ? z.label + " " + z.subtitle : z.label;
        el.appendChild(tag);
      }
      stage.appendChild(el);
    });
  },

  /* Edges — curved lines drawn between two nodes referenced by id, so a new
     center can be authored as pure data with NO exported SVGs. Each edge is one
     absolutely-positioned <svg> spanning the diagram; the path bends by `curve`
     units perpendicular to the line, and an arrowhead is drawn at the `to` end.
       from / to : node ids            style : "solid" | "dashed"
       color     : comm | flow | neutral   curve : bend amount (+/-), 0 = straight
       arrow     : true (default, arrow at `to`) | false (none)
                 | "both" (arrowheads on BOTH ends) | "start" (at `from` only) */
  _renderEdges: function (stage, edges, nodes) {
    if (!edges.length) return;
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });

    // Center of a node in stage units (x/y are top-left).
    function center(n) { return { x: n.x + (n.w || 0) / 2, y: n.y + (n.h || 0) / 2 }; }

    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "edge-layer");
    svg.setAttribute("width", STAGE_W);
    svg.setAttribute("height", STAGE_H);
    svg.setAttribute("viewBox", "0 0 " + STAGE_W + " " + STAGE_H);

    edges.forEach(function (e, i) {
      var a = byId[e.from], b = byId[e.to];
      if (!a || !b) {
        // Most common authoring mistake: a mistyped node id. Skip it safely.
        if (window.console) console.warn("edge skipped — unknown node id:", e.from, "->", e.to);
        return;
      }
      var p1 = center(a), p2 = center(b);
      var curve = e.curve || 0;
      // Control point: midpoint pushed perpendicular to the p1->p2 line.
      var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      var dx = p2.x - p1.x, dy = p2.y - p1.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var cx = mx + (-dy / len) * curve;
      var cy = my + (dx / len) * curve;

      var color = e.color || "flow";
      var stroke = color === "comm" ? "var(--pink)"
                 : color === "neutral" ? "var(--flow)"
                 : "var(--flow)";

      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", "M " + p1.x + " " + p1.y + " Q " + cx + " " + cy + " " + p2.x + " " + p2.y);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", stroke);
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-linecap", "round");
      if (e.style === "dashed") path.setAttribute("stroke-dasharray", "6 6");
      var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "edge");
      g.dataset.layers = (e.layers || []).join(",");
      g.appendChild(path);

      // Draw a filled triangular arrowhead pointing toward `end`, along the
      // given tangent angle, pulled back by the target node's radius so it sits
      // at the node edge instead of hiding under it.
      function addHead(end, ang, nodeW) {
        var size = 9, r = (nodeW || 0) / 2;
        var tip = { x: end.x - Math.cos(ang) * r, y: end.y - Math.sin(ang) * r };
        var left = { x: tip.x - size * Math.cos(ang - 0.5), y: tip.y - size * Math.sin(ang - 0.5) };
        var right = { x: tip.x - size * Math.cos(ang + 0.5), y: tip.y - size * Math.sin(ang + 0.5) };
        var head = document.createElementNS("http://www.w3.org/2000/svg", "path");
        head.setAttribute("d", "M " + tip.x + " " + tip.y + " L " + left.x + " " + left.y + " L " + right.x + " " + right.y + " Z");
        head.setAttribute("fill", stroke);
        g.appendChild(head);
      }

      // Arrowheads. Tangent at the `to` end points control->end; at the `from`
      // end it points control->start. "both" draws one on each end.
      var arrow = e.arrow === undefined ? true : e.arrow;
      if (arrow === true || arrow === "both") {
        addHead(p2, Math.atan2(p2.y - cy, p2.x - cx), b.w); // at `to`
      }
      if (arrow === "start" || arrow === "both") {
        addHead(p1, Math.atan2(p1.y - cy, p1.x - cx), a.w); // at `from`
      }
      svg.appendChild(g);
    });

    stage.appendChild(svg);
  },

  _renderConnectors: function (stage, connectors) {
    connectors.forEach(function (c) {
      var el = document.createElement("div");
      el.className = "connector";
      el.dataset.layers = (c.layers || []).join(",");
      el.style.left = c.x + "px";
      el.style.top = c.y + "px";
      el.style.width = c.w + "px";
      el.style.height = c.h + "px";

      img.src = assetSrc(c.asset);

    });

  _renderNodes: function (stage, nodes) {
    nodes.forEach(function (n) {
      var el = document.createElement("button");
      el.className = "node " + n.type;
      el.dataset.cat = n.category || "neutral";
      el.dataset.layers = (n.layers || []).join(",");
      el.style.left = n.x + "px";
      el.style.top = n.y + "px";
      el.style.width = n.w + "px";
      el.style.height = n.h + "px";
      el.setAttribute("aria-label", n.label);
      // Icon: an exported SVG asset (n.iconAsset, e.g. a Phosphor icon from
      // Figma) takes priority; otherwise a Lucide name (n.icon) is inlined.
      var icHtml = "";
      if (n.iconAsset) {
        icHtml = '<span class="ic"><img class="ic-img" src="' +
          assetSrc(n.iconAsset) + '" alt=""></span>';
      } else if (n.icon) {
        var ic = iconSvg(n.icon, 34);
        if (ic) icHtml = '<span class="ic">' + ic + "</span>";
      }
      // Optional soft glow shape behind the node (resource blobs from Figma).
      var glowHtml = n.glow
        ? '<img class="node-glow" src="' + assetSrc(n.glow) + '" alt="">'
        : "";
      el.innerHTML = glowHtml + icHtml + '<span class="lbl">' + esc(n.label) + "</span>";
      el.addEventListener("click", function () {
        if (Diagram.onNodeClick) Diagram.onNodeClick(n, el);
      });
      stage.appendChild(el);
    });
  },

  _renderPills: function (stage, pills) {
    pills.forEach(function (p) {
      var el = document.createElement("div");
      el.className = "pill " + p.kind;
      el.dataset.layers = (p.layers || []).join(",");
      el.style.left = p.x + "px";
      el.style.top = p.y + "px";
      if (p.w) el.style.minWidth = p.w + "px";
      if (p.h) el.style.height = p.h + "px";
      // Optional leading icon: an exported SVG asset (p.iconAsset, e.g. a
      // Phosphor icon from Figma) takes priority, else a Lucide name (p.icon).
      var icHtml = "";
      if (p.iconAsset) {
        icHtml = '<img class="pill-ic-img" src="' + assetSrc(p.iconAsset) + '" alt="">';
      } else if (p.icon) {
        var ic = iconSvg(p.icon, 13);
        if (ic) icHtml = '<span class="pill-ic">' + ic + "</span>";
      }
      if (icHtml) {
        el.classList.add("has-icon");
        el.innerHTML = icHtml + "<span>" + esc(p.text) + "</span>";
      } else {
        el.textContent = p.text;
      }
      stage.appendChild(el);
    });
  },
};

/* Resolve a connector asset to an <img> src.
   - Normal (multi-file) use: point at the file in /assets, exactly as before.
   - Bundled single-file build: build.sh injects window.ASSET_MAP, a
     { hash: "data:image/svg+xml;..." } lookup, so the SVGs travel inside the
     one HTML file and no separate /assets requests are made. */
function assetSrc(hash) {
  if (window.ASSET_MAP && window.ASSET_MAP[hash]) return window.ASSET_MAP[hash];
  return "assets/" + hash + ".svg";
}

/* Escape text before injecting as HTML. */
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* =============================================================================
 * panels.js — the Layers panel (toggles + show/hide all) and the detail panel
 * ========================================================================== */

var Panels = {
  data: null,
  layerState: {},        // { layerId: true|false }
  onChange: null,        // called whenever visibility changes

  initLayers: function (data, onChange) {
    this.data = data;
    this.onChange = onChange;
    data.layers.forEach(function (l) { Panels.layerState[l.id] = l.on !== false; });

    var host = document.getElementById("layerList");
    host.innerHTML = "";
    data.layers.forEach(function (l) {
      var row = document.createElement("div");
      row.className = "layer-row";
      row.dataset.color = l.color || "neutral";
      row.dataset.layer = l.id;
      row.setAttribute("role", "button");
      row.setAttribute("tabindex", "0");
      row.setAttribute("aria-pressed", String(Panels.layerState[l.id]));
      row.innerHTML =
        '<span class="layer-dot"></span>' +
        '<span class="layer-name">' + escText(l.label) + "</span>" +
        '<span class="switch"></span>';
      row.addEventListener("click", function () { Panels.toggle(l.id); });
      row.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); Panels.toggle(l.id); }
      });
      host.appendChild(row);
    });

    // Staff distribution annotation card
    if (data.staff) {
      var card = document.getElementById("staffCard");
      card.dataset.layers = (data.staff.layers || []).join(",");
      card.innerHTML =
        "<h3>Staff distribution</h3>" +
        "<p>" + escText(data.staff.summary) + "</p>" +
        "<ul>" + (data.staff.breakdown || []).map(function (b) {
          return "<li>" + escText(b) + "</li>";
        }).join("") + "</ul>";
    }

    document.getElementById("showAll").addEventListener("click", function () { Panels.setAll(true); });
    document.getElementById("hideAll").addEventListener("click", function () { Panels.setAll(false); });
  },

  toggle: function (id) {
    this.layerState[id] = !this.layerState[id];
    this._sync(id);
    this.onChange();
  },

  setAll: function (on) {
    var host = document.getElementById("layerList");
    this.data.layers.forEach(function (l) {
      Panels.layerState[l.id] = on;
      var row = host.querySelector('[data-layer="' + l.id + '"]');
      if (row) row.setAttribute("aria-pressed", String(on));
    });
    this.onChange();
  },

  _sync: function (id) {
    var row = document.querySelector('.layer-row[data-layer="' + id + '"]');
    if (row) row.setAttribute("aria-pressed", String(this.layerState[id]));
  },

  /* An element is visible if AT LEAST ONE of its layers is on.
     (Elements with no layers are always visible.) */
  isVisible: function (layersCsv) {
    if (!layersCsv) return true;
    var ids = layersCsv.split(",").filter(Boolean);
    if (!ids.length) return true;
    for (var i = 0; i < ids.length; i++) {
      if (this.layerState[ids[i]]) return true;
    }
    return false;
  },
};

/* --- Detail panel --------------------------------------------------------- */
var Detail = {
  currentId: null,   // which node's detail is showing (for click-to-toggle)

  /* Clicking a node opens its detail; clicking the SAME node again closes it.
     Returns true if the card is now open, false if it was toggled closed. */
  toggle: function (node) {
    var el = document.getElementById("detail");
    if (this.currentId === node.id && el.classList.contains("open")) {
      this.close();
      return false;
    }
    this.open(node);
    return true;
  },

  open: function (node) {
    var el = document.getElementById("detail");
    this.currentId = node.id;
    el.dataset.cat = node.category || "neutral";
    var d = node.detail || {};

    var head = document.getElementById("detailHead");
    head.innerHTML =
      '<button class="detail-close" aria-label="Close">&times;</button>' +
      (d.subtitle ? '<div class="kicker">' + escText(d.subtitle) + "</div>" : "") +
      "<h2>" + escText(node.label) + "</h2>";
    head.querySelector(".detail-close").addEventListener("click", Detail.close);

    var body = document.getElementById("detailBody");
    var html = "";
    if (d.systems && d.systems.length) {
      html += "<h3>Systems used</h3><div>" +
        d.systems.map(function (s) { return '<span class="chip">' + escText(s) + "</span>"; }).join("") +
        "</div>";
    }
    if (d.responsibilities && d.responsibilities.length) {
      html += "<h3>Responsibilities</h3><ul>" +
        d.responsibilities.map(function (r) { return "<li>" + escText(r) + "</li>"; }).join("") +
        "</ul>";
    }
    if (d.notes && d.notes.length) {
      html += "<h3>Notes &amp; observations</h3><ul>" +
        d.notes.map(function (n) { return "<li>" + escText(n) + "</li>"; }).join("") +
        "</ul>";
    }
    if (!html) html = "<p style='color:var(--ink-soft)'>No additional detail recorded yet.</p>";
    body.innerHTML = html;

    el.classList.add("open");
  },

  close: function () {
    document.getElementById("detail").classList.remove("open");
    this.currentId = null;
    // Clear the selected-shape highlight (× button, Escape, or re-click).
    if (window.Diagram && Diagram.select) Diagram.select(null);
  },
};

function escText(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* =============================================================================
 * app.js — wires the data, the diagram, and the panels together.
 * Loaded last. Runs once the DOM and all other scripts are ready.
 * ========================================================================== */

(function () {
  var data = window.DISPATCH_CENTER;
  if (!data) {
    document.body.innerHTML =
      "<p style='padding:40px;font-family:sans-serif'>Could not find dispatch " +
      "center data. Check that data/norcomm.js loaded before app.js.</p>";
    return;
  }

  // --- Header ---------------------------------------------------------------
  document.getElementById("centerName").textContent = data.meta.name;
  document.getElementById("centerSub").textContent =
    [data.meta.location, data.meta.visitDate].filter(Boolean).join(" · ");
  var tagHost = document.getElementById("centerTags");
  (data.meta.tags || []).forEach(function (t) {
    // A tag may be a plain string (legacy) or { label, tone, icon }.
    var label = typeof t === "string" ? t : t.label;
    var tone = typeof t === "string" ? "neutral" : (t.tone || "neutral");
    var icon = typeof t === "string" ? "" : (t.icon || "");
    var s = document.createElement("span");
    s.className = "tag";
    s.dataset.tone = tone;
    // icon is a Lucide name (e.g. "map-pin"); render inline SVG at tag size.
    var ic = iconSvg(icon, 15);
    s.innerHTML = (ic ? '<span class="tag-ic">' + ic + "</span>" : "") +
      "<span>" + esc(label) + "</span>";
    tagHost.appendChild(s);
  });
  document.title = data.meta.name + " — Dispatch Workflow";

  // --- Diagram --------------------------------------------------------------
  Diagram.render(data, function (node, el) {
    var wasOpen = Detail.toggle(node);   // returns true if the card is now open
    Diagram.select(wasOpen ? el : null); // highlight the selected shape, or clear
  });

  // --- Layers ---------------------------------------------------------------
  Panels.initLayers(data, applyVisibility);
  applyVisibility();

  // --- Zoom / pan / fullscreen controls -------------------------------------
  byId("zoomIn").addEventListener("click", function () { Diagram.zoomAt(1.25); });
  byId("zoomOut").addEventListener("click", function () { Diagram.zoomAt(1 / 1.25); });
  byId("zoomFit").addEventListener("click", function () { Diagram.fit(); });
  byId("fullscreen").addEventListener("click", toggleFullscreen);

  // Keep the "Fit" view sensible when entering/leaving fullscreen.
  document.addEventListener("fullscreenchange", function () {
    var on = !!document.fullscreenElement;
    document.body.classList.toggle("is-fullscreen", on);
    // Let the layout settle, then refit.
    setTimeout(function () { Diagram.fit(); }, 60);
  });

  // --- Collapsible layers panel ---------------------------------------------
  byId("panelCollapse").addEventListener("click", function () { setPanel(false); });
  byId("layersReopen").addEventListener("click", function () { setPanel(true); });

  // Close detail panel on Escape.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") Detail.close();
  });

  /* Show/hide every element based on the current layer toggles. Every drawn
     element carries a data-layers attribute — including the incident-flow story
     notes (.annotation-note) and the region blob/labels — so they toggle with
     their layer (e.g. the flow notes hide/show with Incident Flow). */
  function applyVisibility() {
    document.querySelectorAll(
      ".node, .connector, .pill, .zone, .edge, .annotation-note, .region, .region-label"
    ).forEach(function (el) {
      el.classList.toggle("faded", !Panels.isVisible(el.dataset.layers));
    });
    // Staff annotation card
    var staff = document.getElementById("staffCard");
    if (staff) staff.style.display = Panels.isVisible(staff.dataset.layers) ? "" : "none";
  }

  function byId(id) { return document.getElementById(id); }

  /* Collapse/expand the right-hand Layers panel. When collapsed, the diagram
     takes the full width and a small "Layers" tab appears to bring it back. */
  function setPanel(open) {
    document.body.classList.toggle("panel-collapsed", !open);
    // The canvas changed width, so refit after the layout updates.
    setTimeout(function () { Diagram.fit(); }, 60);
  }

  /* Fullscreen the whole app — the biggest readability win inside a small
     SharePoint embed. Falls back silently if the browser blocks it. */
  function toggleFullscreen() {
    var el = document.querySelector(".app");
    if (!document.fullscreenElement) {
      if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }
})();
  </script>
</body>
</html>
