name: Deploy to GitHub Pages

# Deploys the static site (repo root) to GitHub Pages on every push to main.
# No build step — the site is plain HTML/CSS/JS, so we just upload the files.
#
# ⚠️ PUBLIC EXPOSURE — DELIBERATE CHOICE (2026-07-22).
# GitHub Pages is PUBLICLY reachable by URL, even from a private repo (unless the
# org is on GitHub Enterprise Cloud with private Pages). SharePoint's file
# preview / embed sandbox blocks the JavaScript this app needs, so the owner
# chose to host on GitHub Pages and embed that public URL into SharePoint,
# accepting that anyone with the link can view it. If this content is ever
# reclassified as not-for-public, re-disable this trigger and move to a private
# host (e.g. Azure Static Web Apps with sign-in) — see README.md.

on:
  push:
    branches: [main]
  # Also allow manual runs from the Actions tab.
  workflow_dispatch:

# Grant the token the permissions Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a new push cancel an in-progress deploy, but never cancel a run
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the whole repo root (index.html lives at the top level).
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
