  <style>
/* =============================================================================
 * THEME — colors & tokens (taken directly from the Figma design)
 * =============================================================================
 * The Figma palette is intentionally muted. Role circles are all one slate;
 * category color coding lives in labels, pills, and the detail-panel accent.
 * ========================================================================== */

:root {
  /* --- Exact Figma fills --------------------------------------------------- */
  --slate:      #354a57;   /* all role circles */
  --octagon:    #c9d9e4;   /* field-resource octagons */
  --sage:       #a4c5a4;   /* CAD / system boxes */
  --pink:       #b866a3;   /* communication pills & dashed comm paths */
  --red:        #c95548;   /* 911 pill */
  --yellow:     #e2ce88;   /* non-emergency pill */
  --tan:        #c7c0b8;   /* dashed zone outlines */
  --flow:       #6b7280;   /* solid incident-flow lines */
  --paper:      #fefefd;   /* diagram background / pill fills */

  /* --- Category accents (detail panel + layer dots), per concept doc ------- */
  --police:     #2f6fdb;   --police-soft: #e7f0fd;
  --fire:       #e2542c;   --fire-soft:   #fdece6;
  --system:     #4f8a4f;   --system-soft: #eaf3ea;
  --data:       #1f9d68;   --data-soft:   #e4f6ee;
  --neutral:    #354a57;   --neutral-soft:#eef1f5;

  /* --- Surfaces / type ----------------------------------------------------- */
  --bg:         #f3f4f6;
  --canvas-bg:  #fefefd;
  --panel-bg:   #ffffff;
  --border:     #e5e7eb;
  --ink:        #111827;
  --ink-soft:   #6b7280;
  --grid:       #eceef1;

  --radius:     10px;
  --shadow:     0 1px 3px rgba(16,24,40,.08), 0 4px 12px rgba(16,24,40,.06);
  --shadow-lift:0 6px 20px rgba(16,24,40,.16);
  --font: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* Map category name -> accent vars for the detail panel & layer dots. */
[data-cat="police"]  { --c: var(--police);  --c-soft: var(--police-soft);  }
[data-cat="fire"]    { --c: var(--fire);    --c-soft: var(--fire-soft);    }
[data-cat="system"]  { --c: var(--system);  --c-soft: var(--system-soft);  }
[data-cat="data"]    { --c: var(--data);    --c-soft: var(--data-soft);    }
[data-cat="neutral"] { --c: var(--neutral); --c-soft: var(--neutral-soft); }

/* Layer-dot colors */
[data-color="slate"]   { --c: var(--slate);   }
[data-color="blue"]    { --c: var(--octagon); }
[data-color="sage"]    { --c: var(--sage);    }
[data-color="pink"]    { --c: var(--pink);    }
[data-color="flow"]    { --c: var(--flow);    }
[data-color="neutral"] { --c: var(--ink-soft);}
/* =============================================================================
 * APP LAYOUT & COMPONENTS
 * ========================================================================== */

* { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%;
  font-family: var(--font);
  color: var(--ink); background: var(--bg);
}

.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

.app-header {
  display: flex; align-items: baseline; gap: 16px;
  padding: 14px 22px; background: var(--panel-bg);
  border-bottom: 1px solid var(--border); z-index: 5;
}
.app-header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
.app-header .sub { color: var(--ink-soft); font-size: 13px; }
.app-header .tags { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.app-header .tag {
  font-size: 11px; color: var(--ink-soft);
  background: var(--neutral-soft); border-radius: 20px; padding: 3px 10px;
}

.app-body {
  position: relative; display: grid;
  grid-template-columns: 1fr 232px; min-height: 0;
}

/* ---- Canvas -------------------------------------------------------------- */
.canvas-wrap {
  position: relative; overflow: auto;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 26px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 26px 100%,
    var(--canvas-bg);
}
/* The stage is authored in Figma pixels and scaled to fit. */
.stage { position: relative; transform-origin: top left; }

/* Connectors: exact Figma SVGs, positioned absolutely. Behind the nodes. */
.connector { position: absolute; pointer-events: none; }
.connector img { display: block; width: 100%; height: 100%; }

/* Zones: data-drawn grouping outlines (no SVG export needed). */
.zone {
  position: absolute; pointer-events: none;
  border: 1.5px dashed var(--c, var(--tan));
  border-radius: 18px;
}
.zone-label {
  position: absolute; top: -11px; left: 24px;
  background: var(--paper); color: var(--ink-soft);
  font-size: 12px; font-weight: 600; letter-spacing: .5px;
  padding: 0 8px; white-space: nowrap;
}

/* Edges: data-drawn curved lines between nodes. One SVG over the whole stage. */
.edge-layer { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
.edge.faded { opacity: .08; }
.zone.faded { opacity: .08; }

/* ---- Nodes --------------------------------------------------------------- */
.node {
  position: absolute; padding: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  cursor: pointer; border: none; background: transparent;
  transition: transform .12s ease, filter .12s ease, opacity .2s ease;
  z-index: 2;
}
.node:hover { transform: scale(1.05); filter: drop-shadow(var(--shadow-lift)); z-index: 3; }
.node:focus-visible { outline: 3px solid #7aa7ff; outline-offset: 3px; }
.node .lbl { line-height: 1.15; font-weight: 500; }
.node .ic  { font-size: 30px; line-height: 1; }

/* circle roles — solid slate, white text (Figma) */
.node.circle {
  border-radius: 50%; background: var(--slate); color: #fff;
}
.node.circle .lbl { font-size: 12px; padding: 6px; }

/* octagon field resources — light blue fill */
.node.octagon {
  background: var(--octagon); color: var(--ink);
  clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
}
.node.octagon .lbl { font-size: 11px; padding: 2px 8px; }

/* system (CAD) boxes — sage, rounded */
.node.system {
  background: var(--sage); color: var(--ink); border-radius: 4px;
}
.node.system .lbl { font-size: 11px; padding: 8px; }

/* faded = a layer this node belongs to is off */
.faded { opacity: .08 !important; pointer-events: none; }

/* ---- Pills / labels ------------------------------------------------------ */
.pill {
  position: absolute; z-index: 2;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; white-space: nowrap; pointer-events: none;
}
.pill.comm         { background: var(--pink);   color: #fff; border-radius: 4px; }
.pill.c911         { background: var(--red);    color: #fff; border-radius: 22px; }
.pill.nonemergency { background: var(--yellow); color: var(--ink); border-radius: 17px; }
.pill.zonelabel    { background: var(--paper);  color: var(--ink); font-weight: 500; }
.pill.flowlabel    { background: var(--paper);  color: var(--ink); }
.pill.annotation   { color: var(--ink-soft); font-style: italic; background: transparent; }

/* ---- Layer panel --------------------------------------------------------- */
.layer-panel {
  background: var(--panel-bg); border-left: 1px solid var(--border);
  padding: 18px 18px 12px; display: flex; flex-direction: column; overflow-y: auto;
}
.layer-panel h2 {
  font-size: 11px; letter-spacing: 1.5px; color: var(--ink-soft);
  text-transform: uppercase; margin: 0 0 12px;
}
.layer-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 0; cursor: pointer; user-select: none;
}
.layer-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.layer-name { font-size: 13.5px; flex: 1; }
.switch {
  width: 32px; height: 18px; border-radius: 20px; background: #cdd4dd;
  position: relative; transition: background .15s ease; flex: none;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s ease;
}
.layer-row[aria-pressed="true"] .switch { background: var(--slate); }
.layer-row[aria-pressed="true"] .switch::after { left: 16px; }

.panel-actions { margin-top: auto; padding-top: 16px; display: flex; gap: 16px; }
.link-btn {
  background: none; border: none; padding: 0; cursor: pointer;
  color: var(--ink-soft); font-size: 12px; text-decoration: underline;
}
.link-btn:hover { color: var(--ink); }

.staff-card {
  margin-top: 16px; padding: 12px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--neutral-soft);
}
.staff-card h3 { margin: 0 0 6px; font-size: 12px; }
.staff-card p { margin: 0 0 6px; font-size: 12.5px; }
.staff-card ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-soft); }

/* ---- Detail panel -------------------------------------------------------- */
.detail {
  position: absolute; top: 0; right: 0; height: 100%; width: 380px; max-width: 90vw;
  background: var(--panel-bg); border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lift);
  transform: translateX(100%); transition: transform .22s ease;
  z-index: 20; display: flex; flex-direction: column;
}
.detail.open { transform: translateX(0); }
.detail-head { padding: 18px 20px; border-bottom: 1px solid var(--border); border-top: 4px solid var(--c); }
.detail-head .kicker { font-size: 12px; color: var(--c); font-weight: 700; }
.detail-head h2 { margin: 4px 0 2px; font-size: 19px; }
.detail-close {
  position: absolute; top: 14px; right: 14px; border: none; background: none;
  font-size: 22px; cursor: pointer; color: var(--ink-soft); line-height: 1;
}
.detail-body { padding: 18px 20px; overflow-y: auto; }
.detail-body h3 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
  color: var(--ink-soft); margin: 18px 0 8px;
}
.detail-body h3:first-child { margin-top: 0; }
.detail-body ul { margin: 0; padding-left: 20px; }
.detail-body li { margin-bottom: 6px; font-size: 14px; line-height: 1.45; }
.chip {
  display: inline-block; font-size: 12px; padding: 3px 10px; border-radius: 6px;
  background: var(--c-soft); color: var(--c); margin: 0 6px 6px 0;
}

/* ---- Responsive ---------------------------------------------------------- */
@media (max-width: 820px) {
  .app-body { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .layer-panel { border-left: none; border-top: 1px solid var(--border); max-height: 40vh; }
  .app-header .tags { display: none; }
}
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 id="centerName">Dispatch Center</h1>
      <span class="sub" id="centerSub"></span>
      <div class="tags" id="centerTags"></div>
    </header>
    <div class="app-body">
      <div class="canvas-wrap" id="canvasWrap">
        <div class="stage" id="stage"></div>
      </div>
      <aside class="layer-panel">
        <h2>Layers</h2>
        <div id="layerList"></div>
        <div class="panel-actions">
          <button class="link-btn" id="showAll">Show all</button>
          <button class="link-btn" id="hideAll">Hide all</button>
        </div>
        <div class="staff-card" id="staffCard"></div>
      </aside>
      <aside class="detail" id="detail" data-color="neutral">
        <div class="detail-head" id="detailHead"></div>
        <div class="detail-body" id="detailBody"></div>
      </aside>
    </div>
  </div>

/* =============================================================================
 * diagram.js — draws connectors, nodes, and pills from window.DISPATCH_CENTER
 * =============================================================================
 * Plain browser JS, no build step, no modules. Everything is positioned in the
 * Figma coordinate space (2002 x 1303) and the whole stage is scaled to fit.
 * ========================================================================== */

var STAGE_W = 2002;
var STAGE_H = 1303;

var Diagram = {
  data: null,
  onNodeClick: null,

  render: function (data, onNodeClick) {
    this.data = data;
    this.onNodeClick = onNodeClick;

    var stage = document.getElementById("stage");
    stage.style.width = STAGE_W + "px";
    stage.style.height = STAGE_H + "px";
    stage.innerHTML = "";

    // Draw order = stacking order. Zones sit at the very back, then the two
    // ways of drawing lines (exported Figma SVGs and data-driven edges), then
    // the nodes and pills on top.
    this._renderZones(stage, data.zones || []);
    this._renderConnectors(stage, data.connectors || []);
    this._renderEdges(stage, data.edges || [], data.nodes || []);
    this._renderNodes(stage, data.nodes || []);
    this._renderPills(stage, data.pills || []);

    this._fit();
    window.addEventListener("resize", function () { Diagram._fit(); });
  },

  /* Scale the stage so it fits the width. transform:scale doesn't shrink the
     layout box, so negative margins pull the scroll area back to size. */
  _fit: function () {
    var wrap = document.getElementById("canvasWrap");
    var stage = document.getElementById("stage");
    var scale = (wrap.clientWidth - 40) / STAGE_W;
    scale = Math.min(scale, 1);
    if (scale <= 0) return;
    stage.style.transform = "scale(" + scale + ")";
    stage.style.marginBottom = (STAGE_H * scale - STAGE_H) + "px";
    stage.style.marginRight = (STAGE_W * scale - STAGE_W) + "px";
  },

  /* Zones — big grouping outlines (e.g. CALL / POLICE / FIRE) drawn from data,
     no SVG export needed. A dashed rounded rectangle with a small label chip.
     x/y is the TOP-LEFT of the zone in stage units. */
  _renderZones: function (stage, zones) {
    zones.forEach(function (z) {
      var el = document.createElement("div");
      el.className = "zone";
      el.dataset.layers = (z.layers || []).join(",");
      el.dataset.color = z.color || "neutral";
      el.style.left = z.x + "px";
      el.style.top = z.y + "px";
      el.style.width = z.w + "px";
      el.style.height = z.h + "px";
      if (z.label) {
        var tag = document.createElement("span");
        tag.className = "zone-label";
        tag.textContent = z.subtitle ? z.label + " " + z.subtitle : z.label;
        el.appendChild(tag);
      }
      stage.appendChild(el);
    });
  },

  /* Edges — curved lines drawn between two nodes referenced by id, so a new
     center can be authored as pure data with NO exported SVGs. Each edge is one
     absolutely-positioned <svg> spanning the diagram; the path bends by `curve`
     units perpendicular to the line, and an arrowhead is drawn at the `to` end.
       from / to : node ids            style : "solid" | "dashed"
       color     : comm | flow | neutral   curve : bend amount (+/-), 0 = straight
       arrow     : true (default) | false */
  _renderEdges: function (stage, edges, nodes) {
    if (!edges.length) return;
    var byId = {};
    nodes.forEach(function (n) { byId[n.id] = n; });

    // Center of a node in stage units (x/y are top-left).
    function center(n) { return { x: n.x + (n.w || 0) / 2, y: n.y + (n.h || 0) / 2 }; }

    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "edge-layer");
    svg.setAttribute("width", STAGE_W);
    svg.setAttribute("height", STAGE_H);
    svg.setAttribute("viewBox", "0 0 " + STAGE_W + " " + STAGE_H);

    edges.forEach(function (e, i) {
      var a = byId[e.from], b = byId[e.to];
      if (!a || !b) {
        // Most common authoring mistake: a mistyped node id. Skip it safely.
        if (window.console) console.warn("edge skipped — unknown node id:", e.from, "->", e.to);
        return;
      }
      var p1 = center(a), p2 = center(b);
      var curve = e.curve || 0;
      // Control point: midpoint pushed perpendicular to the p1->p2 line.
      var mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      var dx = p2.x - p1.x, dy = p2.y - p1.y;
      var len = Math.sqrt(dx * dx + dy * dy) || 1;
      var cx = mx + (-dy / len) * curve;
      var cy = my + (dx / len) * curve;

      var color = e.color || "flow";
      var stroke = color === "comm" ? "var(--pink)"
                 : color === "neutral" ? "var(--flow)"
                 : "var(--flow)";

      var path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", "M " + p1.x + " " + p1.y + " Q " + cx + " " + cy + " " + p2.x + " " + p2.y);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", stroke);
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-linecap", "round");
      if (e.style === "dashed") path.setAttribute("stroke-dasharray", "6 6");
      var g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "edge");
      g.dataset.layers = (e.layers || []).join(",");
      g.appendChild(path);

      // Arrowhead at the `to` end, aimed along the tangent (control -> end).
      if (e.arrow !== false) {
        var ang = Math.atan2(p2.y - cy, p2.x - cx);
        var size = 9;
        var tip = p2, r = (b.w || 0) / 2;
        // Pull the tip back to the node's edge so it doesn't hide under the node.
        var back = { x: p2.x - Math.cos(ang) * r, y: p2.y - Math.sin(ang) * r };
        tip = back;
        var left = { x: tip.x - size * Math.cos(ang - 0.5), y: tip.y - size * Math.sin(ang - 0.5) };
        var right = { x: tip.x - size * Math.cos(ang + 0.5), y: tip.y - size * Math.sin(ang + 0.5) };
        var head = document.createElementNS("http://www.w3.org/2000/svg", "path");
        head.setAttribute("d", "M " + tip.x + " " + tip.y + " L " + left.x + " " + left.y + " L " + right.x + " " + right.y + " Z");
        head.setAttribute("fill", stroke);
        g.appendChild(head);
      }
      svg.appendChild(g);
    });

    stage.appendChild(svg);
  },

  _renderConnectors: function (stage, connectors) {
    connectors.forEach(function (c) {
      var el = document.createElement("div");
      el.className = "connector";
      el.dataset.layers = (c.layers || []).join(",");
      el.style.left = c.x + "px";
      el.style.top = c.y + "px";
      el.style.width = c.w + "px";
      el.style.height = c.h + "px";
      var img = document.createElement("img");
      img.src = assetSrc(c.asset);
      img.alt = "";
      el.appendChild(img);
      stage.appendChild(el);
    });
  },

  _renderNodes: function (stage, nodes) {
    nodes.forEach(function (n) {
      var el = document.createElement("button");
      el.className = "node " + n.type;
      el.dataset.cat = n.category || "neutral";
      el.dataset.layers = (n.layers || []).join(",");
      el.style.left = n.x + "px";
      el.style.top = n.y + "px";
      el.style.width = n.w + "px";
      el.style.height = n.h + "px";
      el.setAttribute("aria-label", n.label);
      el.innerHTML =
        (n.icon ? '<span class="ic">' + n.icon + "</span>" : "") +
        '<span class="lbl">' + esc(n.label) + "</span>";
      el.addEventListener("click", function () {
        if (Diagram.onNodeClick) Diagram.onNodeClick(n);
      });
      stage.appendChild(el);
    });
  },

  _renderPills: function (stage, pills) {
    pills.forEach(function (p) {
      var el = document.createElement("div");
      el.className = "pill " + p.kind;
      el.dataset.layers = (p.layers || []).join(",");
      el.style.left = p.x + "px";
      el.style.top = p.y + "px";
      if (p.w) el.style.minWidth = p.w + "px";
      if (p.h) el.style.height = p.h + "px";
      el.textContent = p.text;
      stage.appendChild(el);
    });
  },
};

/* Resolve a connector asset to an <img> src.
   - Normal (multi-file) use: point at the file in /assets, exactly as before.
   - Bundled single-file build: build.sh injects window.ASSET_MAP, a
     { hash: "data:image/svg+xml;..." } lookup, so the SVGs travel inside the
     one HTML file and no separate /assets requests are made. */
function assetSrc(hash) {
  if (window.ASSET_MAP && window.ASSET_MAP[hash]) return window.ASSET_MAP[hash];
  return "assets/" + hash + ".svg";
}

/* Escape text before injecting as HTML. */
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* =============================================================================
 * panels.js — the Layers panel (toggles + show/hide all) and the detail panel
 * ========================================================================== */

var Panels = {
  data: null,
  layerState: {},        // { layerId: true|false }
  onChange: null,        // called whenever visibility changes

  initLayers: function (data, onChange) {
    this.data = data;
    this.onChange = onChange;
    data.layers.forEach(function (l) { Panels.layerState[l.id] = l.on !== false; });

    var host = document.getElementById("layerList");
    host.innerHTML = "";
    data.layers.forEach(function (l) {
      var row = document.createElement("div");
      row.className = "layer-row";
      row.dataset.color = l.color || "neutral";
      row.dataset.layer = l.id;
      row.setAttribute("role", "button");
      row.setAttribute("tabindex", "0");
      row.setAttribute("aria-pressed", String(Panels.layerState[l.id]));
      row.innerHTML =
        '<span class="layer-dot"></span>' +
        '<span class="layer-name">' + escText(l.label) + "</span>" +
        '<span class="switch"></span>';
      row.addEventListener("click", function () { Panels.toggle(l.id); });
      row.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); Panels.toggle(l.id); }
      });
      host.appendChild(row);
    });

    // Staff distribution annotation card
    if (data.staff) {
      var card = document.getElementById("staffCard");
      card.dataset.layers = (data.staff.layers || []).join(",");
      card.innerHTML =
        "<h3>Staff distribution</h3>" +
        "<p>" + escText(data.staff.summary) + "</p>" +
        "<ul>" + (data.staff.breakdown || []).map(function (b) {
          return "<li>" + escText(b) + "</li>";
        }).join("") + "</ul>";
    }

    document.getElementById("showAll").addEventListener("click", function () { Panels.setAll(true); });
    document.getElementById("hideAll").addEventListener("click", function () { Panels.setAll(false); });
  },

  toggle: function (id) {
    this.layerState[id] = !this.layerState[id];
    this._sync(id);
    this.onChange();
  },

  setAll: function (on) {
    var host = document.getElementById("layerList");
    this.data.layers.forEach(function (l) {
      Panels.layerState[l.id] = on;
      var row = host.querySelector('[data-layer="' + l.id + '"]');
      if (row) row.setAttribute("aria-pressed", String(on));
    });
    this.onChange();
  },

  _sync: function (id) {
    var row = document.querySelector('.layer-row[data-layer="' + id + '"]');
    if (row) row.setAttribute("aria-pressed", String(this.layerState[id]));
  },

  /* An element is visible if AT LEAST ONE of its layers is on.
     (Elements with no layers are always visible.) */
  isVisible: function (layersCsv) {
    if (!layersCsv) return true;
    var ids = layersCsv.split(",").filter(Boolean);
    if (!ids.length) return true;
    for (var i = 0; i < ids.length; i++) {
      if (this.layerState[ids[i]]) return true;
    }
    return false;
  },
};

/* --- Detail panel --------------------------------------------------------- */
var Detail = {
  open: function (node) {
    var el = document.getElementById("detail");
    el.dataset.cat = node.category || "neutral";
    var d = node.detail || {};

    var head = document.getElementById("detailHead");
    head.innerHTML =
      '<button class="detail-close" aria-label="Close">&times;</button>' +
      (d.subtitle ? '<div class="kicker">' + escText(d.subtitle) + "</div>" : "") +
      "<h2>" + escText(node.label) + "</h2>";
    head.querySelector(".detail-close").addEventListener("click", Detail.close);

    var body = document.getElementById("detailBody");
    var html = "";
    if (d.systems && d.systems.length) {
      html += "<h3>Systems used</h3><div>" +
        d.systems.map(function (s) { return '<span class="chip">' + escText(s) + "</span>"; }).join("") +
        "</div>";
    }
    if (d.responsibilities && d.responsibilities.length) {
      html += "<h3>Responsibilities</h3><ul>" +
        d.responsibilities.map(function (r) { return "<li>" + escText(r) + "</li>"; }).join("") +
        "</ul>";
    }
    if (d.notes && d.notes.length) {
      html += "<h3>Notes &amp; observations</h3><ul>" +
        d.notes.map(function (n) { return "<li>" + escText(n) + "</li>"; }).join("") +
        "</ul>";
    }
    if (!html) html = "<p style='color:var(--ink-soft)'>No additional detail recorded yet.</p>";
    body.innerHTML = html;

    el.classList.add("open");
  },

  close: function () {
    document.getElementById("detail").classList.remove("open");
  },
};

function escText(s) {
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* =============================================================================
 * app.js — wires the data, the diagram, and the panels together.
 * Loaded last. Runs once the DOM and all other scripts are ready.
 * ========================================================================== */

(function () {
  var data = window.DISPATCH_CENTER;
  if (!data) {
    document.body.innerHTML =
      "<p style='padding:40px;font-family:sans-serif'>Could not find dispatch " +
      "center data. Check that data/norcomm.js loaded before app.js.</p>";
    return;
  }

  // --- Header ---------------------------------------------------------------
  document.getElementById("centerName").textContent = data.meta.name;
  document.getElementById("centerSub").textContent =
    [data.meta.location, data.meta.visitDate].filter(Boolean).join(" · ");
  var tagHost = document.getElementById("centerTags");
  (data.meta.tags || []).forEach(function (t) {
    var s = document.createElement("span");
    s.className = "tag";
    s.textContent = t;
    tagHost.appendChild(s);
  });
  document.title = data.meta.name + " — Dispatch Workflow";

  // --- Diagram --------------------------------------------------------------
  Diagram.render(data, function (node) { Detail.open(node); });

  // --- Layers ---------------------------------------------------------------
  Panels.initLayers(data, applyVisibility);
  applyVisibility();

  // Close detail panel on Escape.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") Detail.close();
  });

  /* Show/hide every element based on the current layer toggles.
     Nodes, connectors, and pills all carry a data-layers attribute. */
  function applyVisibility() {
    document.querySelectorAll(".node, .connector, .pill, .zone, .edge").forEach(function (el) {
      el.classList.toggle("faded", !Panels.isVisible(el.dataset.layers));
    });
    // Staff annotation card
    var staff = document.getElementById("staffCard");
    if (staff) staff.style.display = Panels.isVisible(staff.dataset.layers) ? "" : "none";
  }
})();
  </script>
</body>
</html>
