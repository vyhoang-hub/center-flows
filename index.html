<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Research Hub</title>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/hub.css" />
</head>
<body>
  <!-- =========================================================================
       The shell is intentionally empty of content: every heading, center name and
       tab is written at runtime by js/hub.js from the files in data/. That keeps
       the published bundle honest — the encrypted payload holds the research, and
       the plaintext HTML holds no location names (build.sh checks this).

       data-cat="neutral" gives .chip its accent variables, which css/app.css
       defines per-category rather than with a default.
       ====================================================================== -->
  <div class="hub" id="hub" data-cat="neutral">
    <!-- Title, breadcrumb and (on a center) the section tabs -->
    <header class="hub-bar" id="hubBar"></header>

    <!-- The scrolling pane: the home index, or one section of a center -->
    <main class="hub-main" id="hubMain"></main>

    <!-- ===================================================================
         The interactive diagram. Shown in place of #hubMain on a center's
         Mental models tab, and unchanged from when it was the whole page —
         js/app.js still drives it, just via CenterApp.mount() per center.
         ================================================================ -->
    <div class="app" id="centerApp" hidden>
      <!-- Header (hidden inside the hub, which shows the same thing; still
           written to by js/app.js, so it stays in the DOM) -->
      <header class="app-header">
        <h1 id="centerName">Dispatch Center</h1>
        <span class="sub" id="centerSub"></span>
      </header>

      <!-- Body: canvas + layer panel -->
      <div class="app-body">
        <div class="canvas-wrap" id="canvasWrap">
          <div class="stage" id="stage"></div>

          <!-- Zoom / pan / fullscreen toolbar (floats over the canvas) -->
          <div class="canvas-controls" id="canvasControls">
            <button class="ctrl-btn" id="zoomIn"  title="Zoom in">
              <span class="ctrl-ic">+</span><span class="ctrl-lbl">Zoom in</span>
            </button>
            <button class="ctrl-btn" id="zoomOut" title="Zoom out">
              <span class="ctrl-ic">&minus;</span><span class="ctrl-lbl">Zoom out</span>
            </button>
            <button class="ctrl-btn" id="zoomFit" title="Fit the whole diagram">
              <span class="ctrl-ic">⤢</span><span class="ctrl-lbl">Fit</span>
            </button>
            <button class="ctrl-btn" id="fullscreen" title="Fullscreen">
              <span class="ctrl-ic">⛶</span><span class="ctrl-lbl">Fullscreen</span>
            </button>
          </div>

          <!-- Reopen tab, shown only when the layer panel is collapsed -->
          <button class="layers-reopen" id="layersReopen" title="Show the layers panel">
            ☰ Show Layers
          </button>

          <!-- Staff distribution — floats over the bottom-left of the canvas -->
          <div class="staff-card" id="staffCard"></div>
        </div>

        <!-- Layer panel -->
        <aside class="layer-panel" id="layerPanel">
          <div class="layer-panel-head">
            <h2>Layers</h2>
            <button class="panel-collapse" id="panelCollapse" title="Hide the layers panel">
              Hide &rsaquo;
            </button>
          </div>
          <div id="layerList"></div>
          <div class="panel-actions">
            <button class="link-btn" id="showAll">Show all</button>
            <button class="link-btn" id="hideAll">Hide all</button>
          </div>
        </aside>

        <!-- Detail panel (slides in from the right when a node is clicked) -->
        <aside class="detail" id="detail" data-cat="neutral">
          <div class="detail-head" id="detailHead"></div>
          <div class="detail-body" id="detailBody"></div>
        </aside>
      </div>
    </div>
  </div>

  <!-- Load order matters: data first, then renderers, then the app wiring, and
       js/hub.js last because it boots the router.
       Plain <script> tags (no modules) so it works from a double-clicked file. -->
  <!-- Each data file registers itself with the hub, so adding a center means
       adding a file and one line here — nothing else needs to know about it.
       (The registry's name is deliberately not written in this plaintext shell;
       see the canary check in build.sh.) -->
  <script src="data/norcomm.js"></script>
  <script src="data/harbor-point.js"></script>
  <script src="data/riverside.js"></script>
  <script src="js/diagram.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
  <script src="js/hub.js"></script>
</body>
</html>
